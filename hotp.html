<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="preload" href="font/NetflixSans-Medium.otf" as="font" type="font/otf" crossorigin="anonymous">
  <title>1lhtnc</title>
  <style>
    body { margin:0; background:#111; color:#eee; font-family: Arial, sans-serif; }
    #player { width:100vw; height:100vh; }
    .art-control-skip img { width:20px; height:20px; }
    .art-setting .art-setting-item-value{ width:auto!important; max-width:260px!important; overflow:visible!important; text-overflow:initial!important; white-space:nowrap!important; }
    .art-selector-list{ max-width:360px!important; }
    .art-selector-item{ white-space:nowrap!important; }
    .art-info-item:has([data-video="src"]) {
    display: none !important;}
  </style>
  <script src="/npm/artplayer.js"></script>
  <script src="/npm/hls.js"></script>
</head>
<body>
  <div id="player"></div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  (function injectFontFace(){
    if (document.querySelector('style[data-netflix-font]')) return;
    const st = document.createElement('style');
    st.setAttribute('data-netflix-font', '');
    st.textContent = `
    @font-face{
      font-family:'NetflixSans';
      src: url('/font/NetflixSans-Medium.woff2') format('woff2'),
           url('/font/NetflixSans-Medium.otf')  format('opentype');
      font-weight:500;
      font-style:normal;
      font-display:swap;
    }
    `;
    document.head.appendChild(st);
  })();

  const SLUG     = "b6b7e0c5";
  const SCRIPT   = "\/router.php"; 
  const API_BASE = (() => { const m = SCRIPT.match(/^(.*)\/videos\//); return (m? m[1] : '') + '/api'; })();

  const url = `${API_BASE}/get_playback.php?slug=${encodeURIComponent(SLUG)}&ts=${Date.now()}`;
  const res = await fetch(url, { credentials: 'same-origin' });
  if (!res.ok) {
    const txt = await res.text().catch(()=> '');
    console.error('get_playback failed:', res.status, txt);
    alert('Không lấy được cấu hình phát');
    return;
  }
  const cfg = await res.json();

  const inferSubtitleType = (u) => /\.srt(\?|$)/i.test(u) ? 'srt' : 'vtt';
  const pickType = (item) => (item && item.format) ? item.format : inferSubtitleType(item?.url || '');
  const labelFromTop = (top) => {
    const n = parseInt(top, 10);
    if (Math.abs(n - 75) <= 2) return 'Cao';
    if (Math.abs(n - 85) <= 2) return 'Trung bình';
    if (Math.abs(n - 95) <= 2) return 'Thấp';
    return 'Tùy chỉnh';
  };

  const SUB_TOP_DEFAULT = '85%';
  let savedTop      = localStorage.getItem('subtitle_top')      || SUB_TOP_DEFAULT;
  let savedFont     = localStorage.getItem('subtitle_font')     || '"NetflixSans","Oswald","Segoe UI","Roboto","Noto Sans","Helvetica Neue",Arial,sans-serif';
  let savedFontSize = localStorage.getItem('subtitle_fontsize') || 'clamp(0.8rem,3.5vw,5.8rem)';

  const SUB_STYLE_BASE = {
    color:'#fff',
    fontSize: savedFontSize,
    fontFamily: savedFont,
    textShadow:'2px 1px 1px rgba(0,0,0,.4),-1px 1px 1px rgba(0,0,0,.4),2px -1px 1px rgba(0,0,0,.4),-1px -1px 1px rgba(0,0,0,.5)',
    lineHeight:'1.2',
    textAlign:'center',
    position:'absolute',
    left:'50%',
    transform: 'translate(-50%, -100%)',
    width:'clamp(80%, 90vw, 95%)',
    maxWidth:'90%',
    background:'transparent',
    padding:'4px 8px',
    borderRadius:'4px',
    wordWrap:'break-word',
  };

  const applySubtitleStyle = (art, topValue) => {
    const styleObj = { ...SUB_STYLE_BASE, top: topValue, bottom:'auto', position:'absolute' };
    art.subtitle.show = true;
    Object.assign(art.subtitle.style, styleObj);
    const el = art?.template?.$subtitle;
    if (el) Object.assign(el.style, styleObj);
  };

  const ensureSubtitleTopRule = (topValue) => {
    const root = document.querySelector('#player') || document.body;
    let styleTag = root.querySelector('style[data-subtop]');
    if (!styleTag) {
      styleTag = document.createElement('style');
      styleTag.setAttribute('data-subtop','');
      root.appendChild(styleTag);
    }
    styleTag.textContent =
  `.artplayer .art-subtitle{
     top:${topValue} !important;
     bottom:auto !important;
     position:absolute !important;
     font-family:${SUB_STYLE_BASE.fontFamily} !important;
     font-size:${SUB_STYLE_BASE.fontSize} !important;
     transform: translate(-50%, -100%) !important;
   }`;
  };

  const injectModalStyles = () => {
    if (document.querySelector('style[data-subpos-modal]')) return;
    const css = `
    .subpos-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
    .subpos-overlay.show{opacity:1;pointer-events:auto}
    .subpos-sheet{background:#111827;color:#e5e7eb;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(480px,92vw)}
    .subpos-header{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
    .subpos-title{font-weight:600;font-size:16px}
    .subpos-body{padding:14px 18px}
    .subpos-desc{margin-top:6px;font-size:13px;color:#9ca3af}
    .subpos-footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08)}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);cursor:pointer}
    .btn-secondary{background:#0b1220;color:#e5e7eb}
    .btn-primary{background:#22c55e;color:#052e16;border-color:#16a34a}
    @media (max-width:768px){.subpos-sheet{position:fixed;bottom:0;left:0;right:0;width:100%;border-bottom-left-radius:0;border-bottom-right-radius:0;max-width:none}}
    .subpos-row-range{position:relative; padding:8px 0 4px}
    .subpos-range-wrap{position:relative; height:24px; box-sizing:border-box}
    .subpos-range-base,.subpos-range-fill{
      position:absolute; left:0; top:50%; transform:translateY(-50%);
      height:8px; border-radius:999px; pointer-events:none
    }
    .subpos-range-base{ right:0; background:#374151 }
    .subpos-range-fill{ right:auto; background:#22c55e; width:0 }
    .subpos-range{
      position:absolute; inset:0; width:100%; height:100%;
      background:transparent; border:0; outline:none; cursor:pointer;
      -webkit-appearance:none; appearance:none
    }
    .subpos-range::-webkit-slider-runnable-track{background:transparent; height:24px}
    .subpos-range::-moz-range-track{background:transparent; height:24px; border:none}
    .subpos-range::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none;
      width:20px; height:20px; border-radius:50%;
      background:#22c55e; border:2px solid #052e16; box-shadow:0 4px 12px rgba(34,197,94,.35)
    }
    .subpos-range::-moz-range-thumb{
      width:20px; height:20px; border-radius:50%;
      background:#22c55e; border:2px solid #052e16; box-shadow:0 4px 12px rgba(34,197,94,.35)
    }`;
    const st = document.createElement('style');
    st.setAttribute('data-subpos-modal','');
    st.textContent = css;
    document.head.appendChild(st);
  };

  const openSubtitleModal = (art, currentTop) => {
    injectModalStyles();
    const ov = document.createElement('div');
    ov.className = 'subpos-overlay';
    ov.innerHTML = `
      <div class="subpos-sheet">
        <div class="subpos-header">
          <div class="subpos-title">Tùy chỉnh vị trí phụ đề</div>
          <button class="btn btn-secondary" data-close>&times;</button>
        </div>
        <div class="subpos-body">
          <div class="subpos-row-range">
            <div class="subpos-range-wrap">
              <div class="subpos-range-base"></div>
              <div class="subpos-range-fill" style="width:0"></div>
              <input type="range" class="subpos-range" min="50" max="90" step="1" value="${parseInt(currentTop)||85}">
            </div>
          </div>
          <div class="subpos-desc">Kéo để chỉnh vị trí phụ đề lên xuống.</div>
        </div>
        <div class="subpos-footer">
          <button class="btn btn-secondary" data-cancel>Hủy</button>
          <button class="btn btn-primary" data-save>Lưu</button>
        </div>
      </div>
    `;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('show'));

    const wrap  = ov.querySelector('.subpos-range-wrap');
    const fill  = wrap.querySelector('.subpos-range-fill');
    const range = wrap.querySelector('.subpos-range');
    const liveApply = (val) => { applySubtitleStyle(art, val); ensureSubtitleTopRule(val); };

    const THUMB = 20;
    function updateFill(){
      const min = +range.min, max = +range.max, val = +range.value;
      const trackW = wrap.getBoundingClientRect().width;
      const p = (val - min) / (max - min);
      const centerX = p * (trackW - THUMB) + THUMB / 2;
      fill.style.width = Math.max(0, Math.min(trackW, centerX)) + 'px';
    }

    updateFill();
    range.addEventListener('input', () => { updateFill(); liveApply(range.value + '%'); });

    ov.querySelector('[data-close]').onclick =
    ov.querySelector('[data-cancel]').onclick = () => { liveApply(savedTop); closeModal(); };
    ov.querySelector('[data-save]').onclick = () => {
      savedTop = range.value + '%';
      localStorage.setItem('subtitle_top', savedTop);
      liveApply(savedTop);
      art.setting.update({ name:'subtitle-position', tooltip: labelFromTop(savedTop) });
      closeModal();
    };
    function close(){ ov.classList.remove('show'); setTimeout(()=>ov.remove(),200); }
  };

  const subsList   = Array.isArray(cfg.subtitles) ? cfg.subtitles : [];
  const initialSub = subsList.length ? subsList[0] : null;
  const PLAY_URL = "\/m\/b6b7e0c5";
  const playerConfig = {
    container: '#player',
    autoplay: true,
    theme: '#00dc5a',
    poster: cfg.poster || '',
    fullscreen: true,
    setting: true,
    playbackRate: true,
    subtitle: initialSub ? {
      url: initialSub.url,
      type: pickType(initialSub),
      escape: false,
      encoding: 'utf-8',
      style: { ...SUB_STYLE_BASE, top: savedTop },
    } : {
      url:'', type:'vtt', escape:false, encoding:'utf-8',
      style: { ...SUB_STYLE_BASE, top: savedTop },
    },
  };

  playerConfig.url = cfg.hls;
  playerConfig.type = 'm3u8';
  playerConfig.customType = {
    m3u8(video, url) {
      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 60,
          maxMaxBufferLength: 120,
          backBufferLength: 30,
          liveSyncDurationCount: 3,
          startFragPrefetch: false
        });
        hls.loadSource(url); hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
      }
    }
  };

  const art = new Artplayer(playerConfig);
  ensureSubtitleTopRule(savedTop);

  (function setupResumePrompt(){
    const SRC_KEY = (playerConfig && playerConfig.url) || (cfg && cfg.hls) || location.href;
    const PROGRESS_KEY = 'watchpos:' + SRC_KEY;
    let resumePromptShown = false;
    const fmtTime = (s) => {
      s = Math.max(0, Math.floor(s || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
    };
    let lastSave = 0;
    art.on('video:timeupdate', () => {
      const now = Date.now();
      if (now - lastSave > 5000) {
        lastSave = now;
        try {
          const t = Math.floor(art.currentTime || 0);
          localStorage.setItem(PROGRESS_KEY, String(t));
        } catch(e){}
      }
    });
    art.on('video:ended', () => { try { localStorage.removeItem(PROGRESS_KEY); } catch(e){}; });
    (function ensureResumeStyles(){
      if (document.querySelector('style[data-resume-modal]')) return;
      const css = `
      .resume-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
      .resume-overlay.show{opacity:1;pointer-events:auto}
      .resume-sheet{background:#111827;color:#e5e7eb;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(420px,92vw)}
      .resume-header{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600}
      .resume-body{padding:14px 18px;font-size:14px;color:#cbd5e1}
      .resume-footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08)}
      .resume-btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);cursor:pointer}
      .resume-btn-secondary{background:#0b1220;color:#e5e7eb}
      .resume-btn-primary{background:#22c55e;color:#052e16;border-color:#16a34a}
      `;
      const st = document.createElement('style');
      st.setAttribute('data-resume-modal','');
      st.textContent = css;
      document.head.appendChild(st);
    })();

    function openResumeModal(offsetSeconds){
      if (resumePromptShown || document.querySelector('.resume-overlay')) return;
      resumePromptShown = true;

      const overlay = document.createElement('div');
      overlay.className = 'resume-overlay';
      overlay.innerHTML = `
        <div class="resume-sheet">
          <div class="resume-header">Tiếp tục xem?</div>
          <div class="resume-body">
            Bạn đã xem đến <b>${fmtTime(offsetSeconds)}</b>. Bạn muốn tiếp tục từ đó hay xem lại từ đầu?
          </div>
          <div class="resume-footer">
            <button class="resume-btn resume-btn-secondary" data-restart>Xem từ đầu</button>
            <button class="resume-btn resume-btn-primary" data-continue>Tiếp tục xem</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(()=> overlay.classList.add('show'));

      overlay.querySelector('[data-continue]').onclick = () => { try { art.seek = offsetSeconds; } catch(e){}; close(); };
      overlay.querySelector('[data-restart]').onclick  = () => { try { art.seek = 0; localStorage.removeItem(PROGRESS_KEY); } catch(e){}; close(); };
      function close(){ overlay.classList.remove('show'); setTimeout(()=>overlay.remove(),200); }
    }

    function tryAsk(){
      if (resumePromptShown) return;

      let saved = 0;
      try { saved = parseInt(localStorage.getItem(PROGRESS_KEY) || '0', 10) || 0; } catch(e){}
      const dur = Math.floor(art.duration || 0);
      if (dur > 0 && saved >= 10 && saved < Math.max(10, dur - 3)) openResumeModal(saved);
    }
    art.on('ready', () => setTimeout(tryAsk, 0));
    art.on('video:loadedmetadata', () => setTimeout(tryAsk, 0));
  })();

  art.controls.add({
    name: 'backward', index: 10, position: 'right',
    html: '<div class="art-control-skip"><img class="w-4 h-4" src="/svg/-10.svg" /></div>',
    click: () => { art.seek = Math.max(0, art.currentTime - 10); },
  });
  art.controls.add({
    name: 'forward', index: 12, position: 'right',
    html: '<div class="art-control-skip"><img class="w-4 h-4" src="/svg/+10.svg" /></div>',
    click: () => { art.seek = Math.min(art.duration || 0, art.currentTime + 10); },
  });

  if (subsList.length) {
    const initialLabel = initialSub?.language || 'Chọn phụ đề';
    art.setting.add({
      name:'subtitle-selector',
      html:'Phụ đề',
      tooltip: initialLabel,
      icon:'<img src="/svg/subtitle.svg" style="width:20px;height:20px;" />',
      selector: [
        { html:'Tắt phụ đề', value:'off' },
        ...subsList.map((s,i)=>({ html:s.language || ('Subtitle '+(i+1)), value:s.url, default:i===0 })),
      ],
      onSelect(item){
        if(item.value==='off'){
          art.subtitle.show=false;
        } else {
          const found = subsList.find(s => s.url === item.value);
          art.subtitle.type = pickType(found);
          art.subtitle.url  = item.value;
          art.subtitle.show = true;
          applySubtitleStyle(art, savedTop);
          ensureSubtitleTopRule(savedTop);
        }
        art.setting.update({ name:'subtitle-selector', html:'Phụ đề', tooltip:item.html });
        return item.html;
      }
    });
  }

  const POSITION_PRESETS = [
    { html:'Cao',        value:'75%' },
    { html:'Trung bình', value:'85%' },
    { html:'Thấp',       value:'95%' },
    { html:'Tùy chỉnh…', value:'__custom__' },
  ];
  art.setting.add({
    name:'subtitle-position',
    html:'Vị trí phụ đề',
    tooltip: labelFromTop(savedTop),
    selector: POSITION_PRESETS.map(p => ({
      ...p,
      default: p.value !== '__custom__' && p.value === savedTop
    })),
    onSelect(item){
      if(item.value==='__custom__'){
        openSubtitleModal(art, savedTop);
        return labelFromTop(savedTop);
      }
      savedTop = item.value;
      localStorage.setItem('subtitle_top', savedTop);
      applySubtitleStyle(art, savedTop);
      ensureSubtitleTopRule(savedTop);
      return labelFromTop(savedTop);
    }
  });

  const FONT_PRESETS = [
    { html:'NetflixSans', value: '"NetflixSans","Oswald","Segoe UI","Roboto","Noto Sans","Helvetica Neue",Arial,sans-serif' },
    { html:'Oswald',      value: '"Oswald","Segoe UI","Roboto","Noto Sans","Helvetica Neue",Arial,sans-serif' },
    { html:'Roboto',      value: '"Roboto","Noto Sans","Helvetica Neue",Arial,sans-serif' },
    { html:'Arial',       value: 'Arial,sans-serif' },
  ];
  const currentFontLabel = (() => {
    const f = FONT_PRESETS.find(x => x.value === SUB_STYLE_BASE.fontFamily);
    return f ? f.html : 'NetflixSans';
  })();
  art.setting.add({
    name: 'subtitle-font',
    html: 'Font phụ đề',
    tooltip: currentFontLabel,
    selector: FONT_PRESETS.map(f => ({ ...f, default: f.value === SUB_STYLE_BASE.fontFamily })),
    onSelect(item){
      SUB_STYLE_BASE.fontFamily = item.value;
      localStorage.setItem('subtitle_font', item.value);
      applySubtitleStyle(art, savedTop);
      ensureSubtitleTopRule(savedTop);
      return item.html;
    }
  });

  const SIZE_PRESETS = [
    { html: 'Nhỏ',      value: 'clamp(0.7rem, 2.4vw, 2.8rem)' },
    { html: 'Vừa',      value: 'clamp(0.8rem, 3.0vw, 3.6rem)' },
    { html: 'Lớn',      value: 'clamp(1.0rem, 3.6vw, 4.5rem)' },
    { html: 'Rất lớn',  value: 'clamp(1.2rem, 4.2vw, 5.8rem)' },
  ];
  const currentSizeLabel = (() => {
    const s = SIZE_PRESETS.find(x => x.value === SUB_STYLE_BASE.fontSize);
    return s ? s.html : 'Vừa';
  })();
  art.setting.add({
    name: 'subtitle-size',
    html: 'Cỡ chữ phụ đề',
    tooltip: currentSizeLabel,
    selector: SIZE_PRESETS.map(s => ({ ...s, default: s.value === SUB_STYLE_BASE.fontSize })),
    onSelect(item){
      SUB_STYLE_BASE.fontSize = item.value;
      localStorage.setItem('subtitle_fontsize', item.value);
      applySubtitleStyle(art, savedTop);
      ensureSubtitleTopRule(savedTop);
      return item.html;
    }
  });
});
</script>
